<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Happy 18th, Rassel 🎂</title>
<style>
  :root{
    --kraft:#c9a876;
    --kraft-dark:#b6935f;
    --maroon:#9b2350;
    --cream:#f2e9d8;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0;padding:0;height:100%;
    background:var(--kraft);
    background-image:
      repeating-linear-gradient(0deg, rgba(0,0,0,0.03) 0 2px, transparent 2px 6px),
      repeating-linear-gradient(90deg, rgba(0,0,0,0.02) 0 2px, transparent 2px 6px);
    font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    overflow-x:hidden;
    color:#3a2a1a;
  }
  #app{
    min-height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:8vh 4vw 6vh;
  }

  /* ---------- COVER ---------- */
  #coverStage{
    perspective:2200px;
    width:min(88vw, 380px);
  }
  #cover{
    width:100%;
    display:block;
    border-radius:10px;
    box-shadow:0 18px 40px rgba(0,0,0,0.35), 0 4px 10px rgba(0,0,0,0.2);
    cursor:pointer;
    transform-origin:left center;
    transition:transform 0.9s cubic-bezier(.6,.05,.28,.99), opacity 0.6s ease 0.35s;
    will-change:transform;
    -webkit-user-select:none;user-select:none;
  }
  #cover:active{ transform:scale(0.985); }
  #cover.opening{
    transform:rotateY(-125deg) scale(0.94);
    opacity:0;
    pointer-events:none;
  }
  #coverHint{
    text-align:center;
    margin-top:14px;
    font-size:0.85rem;
    color:#5c4326;
    opacity:0.85;
    letter-spacing:0.02em;
  }
  #coverStage.hidden{ display:none; }

  /* ---------- SPREAD ---------- */
  #spreadWrap{
    display:none;
    width:100%;
    max-width:900px;
    flex-direction:column;
    align-items:center;
  }
  #spreadWrap.visible{ display:flex; animation:fadeUp 0.7s ease both; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #topBar{
    width:100%;
    display:flex;
    justify-content:center;
    margin-bottom:14px;
  }
  #backBtn{
    font-family:inherit;
    font-size:0.85rem;
    padding:8px 16px;
    border-radius:999px;
    border:1px solid rgba(0,0,0,0.25);
    background:var(--cream);
    color:#4a3722;
    cursor:pointer;
    box-shadow:0 2px 6px rgba(0,0,0,0.15);
  }
  #backBtn:active{ transform:scale(0.96); }

  #spread{
    width:100%;
    display:flex;
    gap:3vw;
    justify-content:center;
    align-items:flex-start;
    perspective:2000px;
  }
  .page{
    position:relative;
    width:calc(50% - 1.5vw);
    max-width:420px;
    aspect-ratio:900/1268;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 10px 26px rgba(0,0,0,0.28);
    background-size:cover;
    background-position:center;
    animation:pageIn 0.8s cubic-bezier(.4,.1,.3,1) both;
  }
  .page.leftPage{ animation-delay:0.05s; transform-origin:right center; }
  .page.rightPage{ animation-delay:0.15s; transform-origin:left center; }
  @keyframes pageIn{
    from{ opacity:0; transform:rotateY(45deg) scale(0.92); }
    to{ opacity:1; transform:rotateY(0) scale(1); }
  }
  .page.leftPage{ transform-origin: right center; }
  .page.rightPage{ transform-origin: left center; }
  .page.leftPage{ animation-name: pageInLeft; }
  .page.rightPage{ animation-name: pageInRight; }
  @keyframes pageInLeft{
    from{ opacity:0; transform:rotateY(-55deg); }
    to{ opacity:1; transform:rotateY(0); }
  }
  @keyframes pageInRight{
    from{ opacity:0; transform:rotateY(55deg); }
    to{ opacity:1; transform:rotateY(0); }
  }

  /* ---- Left page: envelope / letter ---- */
  #envelopeArea{
    position:absolute;
    inset:0;
    cursor:pointer;
    -webkit-user-select:none;user-select:none;
  }
  #letterFull{
    position:absolute;
    left:50%;
    top:58%;
    width:82%;
    transform:translate(-50%,-38%) scale(0.82);
    opacity:0;
    border-radius:4px;
    box-shadow:0 4px 10px rgba(0,0,0,0.0);
    transition:transform 0.55s cubic-bezier(.34,1.3,.4,1), opacity 0.4s ease;
    pointer-events:none;
  }
  #letterFull.lifted{
    top:50%;
    transform:translate(-50%,-50%) scale(1);
    opacity:1;
    box-shadow:0 14px 30px rgba(0,0,0,0.4);
    pointer-events:auto;
  }
  #letterTapHint{
    position:absolute;
    bottom:6%;
    left:0; right:0;
    text-align:center;
    font-size:0.72rem;
    color:#fff;
    text-shadow:0 1px 3px rgba(0,0,0,0.6);
    opacity:0.9;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  #envelopeArea.isLifted #letterTapHint{ opacity:0; }

  /* ---- Right page: candles ---- */
  #candlesArea{
    position:absolute;
    inset:0;
  }
  .flame{
    position:absolute;
    transform-origin:50% 90%;
    filter:drop-shadow(0 2px 4px rgba(0,0,0,0.25));
    animation:flicker 1.6s ease-in-out infinite;
    transition:opacity 0.35s ease;
  }
  @keyframes flicker{
    0%,100%{ transform:rotate(-2deg) scale(1); }
    30%{ transform:rotate(1.5deg) scale(1.03); }
    55%{ transform:rotate(-1deg) scale(0.98); }
    80%{ transform:rotate(2deg) scale(1.02); }
  }
  .flame.blowing{ animation:none; }
  .flame.out{ opacity:0; }

  #micUi{
    position:absolute;
    top:2.5%;
    left:5%;
    right:5%;
    display:flex;
    flex-direction:column;
    gap:3px;
    align-items:stretch;
  }
  #meterTrack{
    width:100%;
    height:7px;
    border-radius:6px;
    background:rgba(255,255,255,0.55);
    border:1px solid rgba(0,0,0,0.15);
    overflow:hidden;
  }
  #meterFill{
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#e0a13a,var(--maroon));
    transition:width 0.06s linear;
  }
  #micLabel{
    font-size:0.58rem;
    color:#3a2a1a;
    background:rgba(255,255,255,0.55);
    padding:2px 6px;
    border-radius:6px;
    align-self:flex-start;
    text-align:left;
  }

  #blowControls{
    position:absolute;
    bottom:2.5%;
    left:5%;
    right:5%;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:4px;
  }
  #micEnableBtn, #holdBlowBtn{
    font-family:inherit;
    border:none;
    border-radius:999px;
    padding:6px 10px;
    font-size:0.62rem;
    line-height:1.2;
    cursor:pointer;
    box-shadow:0 3px 8px rgba(0,0,0,0.25);
    width:100%;
    min-width:0;
  }
  #micEnableBtn{
    background:var(--maroon);
    color:#fff;
  }
  #holdBlowBtn{
    background:var(--cream);
    color:#3a2a1a;
  }
  #holdBlowBtn:active, #holdBlowBtn.active{
    background:#e4d6b8;
    transform:scale(0.97);
  }
  #hostNote{
    display:none;
    position:absolute;
    bottom:100%;
    left:0; right:0;
    margin-bottom:4px;
    font-size:0.55rem;
    color:#3a2a1a;
    background:rgba(255,255,255,0.7);
    padding:2px 6px;
    border-radius:5px;
    text-align:center;
  }
  #hostNote.show{ display:block; }

  /* ---- Wish overlay ---- */
  #wishOverlay{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(30,15,10,0.0);
    opacity:0;
    pointer-events:none;
    transition:opacity 0.5s ease, background 0.5s ease;
    text-align:center;
    padding:8%;
  }
  #wishOverlay.show{
    opacity:1;
    pointer-events:auto;
    background:rgba(30,15,10,0.38);
  }
  #wishBox{
    background:var(--cream);
    border-radius:10px;
    padding:20px 16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4);
    transform:scale(0.85);
    transition:transform 0.5s cubic-bezier(.34,1.4,.4,1);
  }
  #wishOverlay.show #wishBox{ transform:scale(1); }
  #wishBox h3{
    margin:0 0 8px;
    font-size:1.05rem;
    color:var(--maroon);
  }
  #wishBox p{
    margin:0 0 12px;
    font-size:0.8rem;
    color:#4a3722;
  }
  #relightBtn{
    font-family:inherit;
    border:none;
    background:var(--maroon);
    color:#fff;
    padding:8px 18px;
    border-radius:999px;
    font-size:0.8rem;
    cursor:pointer;
  }

  #confettiCanvas{
    position:absolute;
    inset:0;
    pointer-events:none;
  }

  @media (max-width:560px){
    #spread{ gap:2.5vw; }
    #micLabel, #hostNote{ font-size:0.6rem; }
    #letterTapHint{ font-size:0.65rem; }
  }
</style>
</head>
<body>
<div id="app">

  <div id="coverStage">
    <img id="cover" src="" alt="Tap to open">
    <div id="coverHint">tap the cover to open ✦</div>
  </div>

  <div id="spreadWrap">
    <div id="topBar">
      <button id="backBtn">← back to cover</button>
    </div>
    <div id="spread">

      <div class="page leftPage" id="leftPage">
        <div id="envelopeArea">
          <img id="envelopeBg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
          <img id="letterFull" src="" alt="letter">
          <div id="letterTapHint">tap the letter to read it ✦</div>
        </div>
      </div>

      <div class="page rightPage" id="rightPage">
        <img id="cakeBg" src="" alt="" style="width:100%;height:100%;object-fit:cover;display:block;">
        <div id="candlesArea">
          <img class="flame" id="flame1" src="" alt="">
          <img class="flame" id="flame2" src="" alt="">
        </div>
        <canvas id="confettiCanvas"></canvas>

        <div id="micUi">
          <div id="meterTrack"><div id="meterFill"></div></div>
          <div id="micLabel">🎤 blow into your mic to blow out the candles</div>
        </div>

        <div id="blowControls">
          <button id="micEnableBtn">🎤 Enable microphone</button>
          <button id="holdBlowBtn">Hold to blow 🌬️ (or hold Space)</button>
          <div id="hostNote">Mic needs https hosting — if blocked, use the button above.</div>
        </div>

        <div id="wishOverlay">
          <div id="wishBox">
            <h3>Make a wish, Rassel 🌟</h3>
            <p>Happiest 18th birthday. Here's to everything ahead of you.</p>
            <button id="relightBtn">🕯️ Relight candles</button>
          </div>
        </div>
      </div>

    </div>
  </div>

</div>

(function(){
  // ---------- wire up images ----------
  document.getElementById('cover').src = ASSETS.cover;
  document.getElementById('envelopeBg').src = ASSETS.envelopeClosed;
  document.getElementById('letterFull').src = ASSETS.letterFull;
  document.getElementById('cakeBg').src = ASSETS.cakeBg;
  document.getElementById('flame1').src = ASSETS.flame1;
  document.getElementById('flame2').src = ASSETS.flame2;

  // flame positions as % of the 1240x1748 source canvas
  var FLAME_POS = {
    flame1: { left:37.177, top:37.987, width:7.419, height:7.551 },
    flame2: { left:53.306, top:38.902, width:7.339, height:7.723 }
  };
  Object.keys(FLAME_POS).forEach(function(id){
    var el = document.getElementById(id);
    var p = FLAME_POS[id];
    el.style.left = p.left + '%';
    el.style.top = p.top + '%';
    el.style.width = p.width + '%';
    el.style.height = p.height + '%';
  });

  // ---------- cover open / close ----------
  var coverStage = document.getElementById('coverStage');
  var cover = document.getElementById('cover');
  var spreadWrap = document.getElementById('spreadWrap');
  var backBtn = document.getElementById('backBtn');

  function openCard(){
    cover.classList.add('opening');
    setTimeout(function(){
      coverStage.classList.add('hidden');
      spreadWrap.classList.add('visible');
    }, 520);
  }
  function closeCard(){
    spreadWrap.classList.remove('visible');
    coverStage.classList.remove('hidden');
    // allow reflow then remove opening class to play reverse-ish (just resets)
    requestAnimationFrame(function(){
      cover.classList.remove('opening');
    });
  }
  cover.addEventListener('click', openCard);
  backBtn.addEventListener('click', closeCard);

  // ---------- envelope / letter ----------
  var envelopeArea = document.getElementById('envelopeArea');
  var letterFull = document.getElementById('letterFull');
  var lifted = false;
  envelopeArea.addEventListener('click', function(){
    lifted = !lifted;
    letterFull.classList.toggle('lifted', lifted);
    envelopeArea.classList.toggle('isLifted', lifted);
  });

  // ---------- candles / blow detection ----------
  var flame1 = document.getElementById('flame1');
  var flame2 = document.getElementById('flame2');
  var flames = [flame1, flame2];
  var lit = [true, true];

  var meterFill = document.getElementById('meterFill');
  var micEnableBtn = document.getElementById('micEnableBtn');
  var holdBlowBtn = document.getElementById('holdBlowBtn');
  var wishOverlay = document.getElementById('wishOverlay');
  var relightBtn = document.getElementById('relightBtn');

  var audioCtx = null, analyser = null, micStream = null, dataArray = null;
  var micActive = false;
  var manualBlow = false;
  var blowHoldMs = 0;
  var lastFrameTime = null;
  var BLOW_THRESHOLD = 0.045;   // rms threshold, tuned empirically
  var BLOW_DURATION_NEEDED = 550; // ms

  function setMeter(level){
    var pct = Math.max(0, Math.min(1, level / 0.25)) * 100;
    meterFill.style.width = pct + '%';
  }

  var hostNote = document.getElementById('hostNote');

  async function enableMic(){
    if(micActive) return;
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      micEnableBtn.textContent = '🎤 Mic unavailable';
      hostNote.classList.add('show');
      return;
    }
    try{
      micStream = await navigator.mediaDevices.getUserMedia({ audio:true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      var source = audioCtx.createMediaStreamSource(micStream);
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 512;
      analyser.smoothingTimeConstant = 0.6;
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.fftSize);
      micActive = true;
      micEnableBtn.textContent = '🎤 Mic active';
      micEnableBtn.disabled = true;
      micEnableBtn.style.opacity = '0.6';
    }catch(err){
      micEnableBtn.textContent = '🎤 Mic blocked';
      hostNote.classList.add('show');
      console.warn('mic error', err);
    }
  }
  micEnableBtn.addEventListener('click', enableMic);

  function getMicLevel(){
    if(!micActive || !analyser) return 0;
    analyser.getByteTimeDomainData(dataArray);
    var sumSq = 0;
    for(var i=0;i<dataArray.length;i++){
      var v = (dataArray[i]-128)/128;
      sumSq += v*v;
    }
    return Math.sqrt(sumSq/dataArray.length); // RMS 0..~0.7
  }

  // manual hold fallback
  function setManual(v){ manualBlow = v; holdBlowBtn.classList.toggle('active', v); }
  ['mousedown','touchstart'].forEach(function(ev){
    holdBlowBtn.addEventListener(ev, function(e){ e.preventDefault(); setManual(true); }, {passive:false});
  });
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(function(ev){
    holdBlowBtn.addEventListener(ev, function(e){ setManual(false); });
  });
  window.addEventListener('keydown', function(e){
    if(e.code === 'Space'){ e.preventDefault(); setManual(true); }
  });
  window.addEventListener('keyup', function(e){
    if(e.code === 'Space'){ e.preventDefault(); setManual(false); }
  });

  function bendFlame(el, strength){
    var deg = 18 + strength*22;
    var dx = 4 + strength*10;
    el.style.transform = 'rotate(' + deg + 'deg) translateX(' + dx + 'px) scale(' + (1-0.08*strength) + ')';
  }
  function resetFlameTransform(el){
    el.style.transform = '';
  }

  function extinguish(el, idx){
    if(!lit[idx]) return;
    lit[idx] = false;
    el.classList.add('blowing');
    el.style.transition = 'opacity 0.35s ease, transform 0.35s ease';
    el.style.transform = 'rotate(48deg) translateX(14px) scale(0.5)';
    requestAnimationFrame(function(){
      el.classList.add('out');
    });
    checkAllOut();
  }

  function checkAllOut(){
    if(!lit[0] && !lit[1]){
      setTimeout(showWish, 400);
    }
  }

  function showWish(){
    wishOverlay.classList.add('show');
    launchConfetti();
  }

  function relight(){
    lit = [true, true];
    flames.forEach(function(el){
      el.classList.remove('out','blowing');
      el.style.transition = 'opacity 0.4s ease';
      resetFlameTransform(el);
    });
    wishOverlay.classList.remove('show');
    blowHoldMs = 0;
    stopConfetti();
  }
  relightBtn.addEventListener('click', relight);

  function animLoop(ts){
    if(lastFrameTime === null) lastFrameTime = ts;
    var dt = ts - lastFrameTime;
    lastFrameTime = ts;

    var micLevel = getMicLevel();
    setMeter(Math.max(micLevel, manualBlow ? 0.2 : 0));

    var blowing = (micLevel > BLOW_THRESHOLD) || manualBlow;
    var anyLit = lit[0] || lit[1];

    if(blowing && anyLit){
      blowHoldMs += dt;
      var strength = Math.min(1, blowHoldMs / BLOW_DURATION_NEEDED);
      flames.forEach(function(el, idx){
        if(lit[idx]) bendFlame(el, strength);
      });
      if(blowHoldMs >= BLOW_DURATION_NEEDED){
        flames.forEach(function(el, idx){ extinguish(el, idx); });
        blowHoldMs = 0;
      }
    } else {
      blowHoldMs = Math.max(0, blowHoldMs - dt*1.5);
      flames.forEach(function(el, idx){
        if(lit[idx] && blowHoldMs <= 0){
          resetFlameTransform(el);
        }
      });
    }

    requestAnimationFrame(animLoop);
  }
  requestAnimationFrame(animLoop);

  // ---------- confetti ----------
  var canvas = document.getElementById('confettiCanvas');
  var ctx = canvas.getContext('2d');
  var confettiParticles = [];
  var confettiRAF = null;
  var confettiColors = ['#9b2350','#e0a13a','#8a9a5b','#f2e9d8','#c94f4f'];

  function resizeCanvas(){
    var rect = canvas.parentElement.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
  }
  window.addEventListener('resize', resizeCanvas);

  function launchConfetti(){
    resizeCanvas();
    confettiParticles = [];
    var count = 70;
    for(var i=0;i<count;i++){
      confettiParticles.push({
        x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.4,
        w: 5+Math.random()*5,
        h: 8+Math.random()*6,
        color: confettiColors[Math.floor(Math.random()*confettiColors.length)],
        vy: 1.5+Math.random()*2.5,
        vx: (Math.random()-0.5)*1.6,
        rot: Math.random()*360,
        vrot: (Math.random()-0.5)*10
      });
    }
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    confettiStep();
  }
  function confettiStep(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    var stillGoing = false;
    confettiParticles.forEach(function(p){
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vrot;
      if(p.y < canvas.height+20) stillGoing = true;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
    });
    if(stillGoing && wishOverlay.classList.contains('show')){
      confettiRAF = requestAnimationFrame(confettiStep);
    }
  }
  function stopConfetti(){
    if(confettiRAF) cancelAnimationFrame(confettiRAF);
    ctx.clearRect(0,0,canvas.width,canvas.height);
  }

})();
</script>
